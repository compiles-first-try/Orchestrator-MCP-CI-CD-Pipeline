name: build-images

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        image:
          - name: api
            dockerfile: infra/api.Dockerfile
          - name: slack-bot
            dockerfile: infra/slack-bot.Dockerfile
          - name: mock-orchestrator-mcp
            dockerfile: infra/mocks/mock-orchestrator-mcp/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo_lc=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
          ref_slug=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "image=ghcr.io/${owner_lc}/${repo_lc}/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tag_ref=${ref_slug}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag_sha }}
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag_ref }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
