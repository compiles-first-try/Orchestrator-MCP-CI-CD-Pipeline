services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rpa
      POSTGRES_PASSWORD: rpa
      POSTGRES_DB: rpa_platform
    ports:
      # Host port 5433 → container port 5432. Avoids conflict when the host
      # already has another postgres bound to 5432 (native install, or a
      # different project's Docker container). Internal container-to-container
      # communication still uses 5432 — see the api service's DATABASE_URL.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpa -d rpa_platform"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - rpa-postgres:/var/lib/postgresql/data

  mock-orchestrator-mcp:
    build:
      context: ./mocks/mock-orchestrator-mcp
    environment:
      PORT: 4000
    ports:
      - "4000:4000"

  mock-github-action:
    build:
      context: ./mocks/mock-github-action
    environment:
      PORT: 4100
    ports:
      - "4100:4100"

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    # Compose v2 reads .env from the directory of THIS file by default
    # (infra/), but the project's .env lives at the workspace root. Point
    # at it explicitly so SLACK_*, GITHUB_*, RPA_* etc. flow into the
    # container. Service-specific overrides below stay authoritative.
    env_file:
      - ../.env
    environment:
      # Override .env's localhost URL — inside the container we reach
      # postgres at the service hostname `postgres`, not localhost.
      DATABASE_URL: postgres://rpa:rpa@postgres:5432/rpa_platform
      ORCHESTRATOR_MCP_URL: http://mock-orchestrator-mcp:4000
      API_PORT: 3000
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  slack-bot:
    build:
      context: ..
      dockerfile: infra/slack-bot.Dockerfile
    env_file:
      - ../.env
    environment:
      API_BASE_URL: http://api:3000
      PORT: 3001
      LOG_LEVEL: info
    depends_on:
      - api

volumes:
  rpa-postgres: {}
