name: Deploy to UiPath Orchestrator

on:
  push:
    branches: [dev]
  pull_request:
    types: [closed]
    branches: [test, stage, main]

concurrency:
  group: deploy-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target tenant
        id: tenant
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_NAME -eq "dev") {
            "tenant=dev" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
            "mode=apply" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          } elseif ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            switch ($env:GITHUB_BASE_REF) {
              "test"  { "tenant=test"  | Out-File -Append -FilePath $env:GITHUB_OUTPUT; "mode=apply" | Out-File -Append -FilePath $env:GITHUB_OUTPUT }
              "stage" { "tenant=stage" | Out-File -Append -FilePath $env:GITHUB_OUTPUT; "mode=apply" | Out-File -Append -FilePath $env:GITHUB_OUTPUT }
              "main"  { "tenant=prod"  | Out-File -Append -FilePath $env:GITHUB_OUTPUT; "mode=apply" | Out-File -Append -FilePath $env:GITHUB_OUTPUT }
              default {
                Write-Error "Unrecognised target branch: $($env:GITHUB_BASE_REF)"
                exit 1
              }
            }
          } else {
            Write-Error "Unexpected event context"
            exit 1
          }
          Write-Output "Target tenant: $((Get-Content $env:GITHUB_OUTPUT | Select-String 'tenant=').ToString().Split('=')[1])"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Orchestrator
        shell: pwsh
        env:
          TENANT: ${{ steps.tenant.outputs.tenant }}
          DEPLOY_MODE: ${{ steps.tenant.outputs.mode }}
          ORCHESTRATOR_DEV_CLIENT_ID: ${{ secrets.ORCHESTRATOR_DEV_CLIENT_ID }}
          ORCHESTRATOR_DEV_CLIENT_SECRET: ${{ secrets.ORCHESTRATOR_DEV_CLIENT_SECRET }}
          ORCHESTRATOR_TEST_CLIENT_ID: ${{ secrets.ORCHESTRATOR_TEST_CLIENT_ID }}
          ORCHESTRATOR_TEST_CLIENT_SECRET: ${{ secrets.ORCHESTRATOR_TEST_CLIENT_SECRET }}
          ORCHESTRATOR_STAGE_CLIENT_ID: ${{ secrets.ORCHESTRATOR_STAGE_CLIENT_ID }}
          ORCHESTRATOR_STAGE_CLIENT_SECRET: ${{ secrets.ORCHESTRATOR_STAGE_CLIENT_SECRET }}
          ORCHESTRATOR_PROD_CLIENT_ID: ${{ secrets.ORCHESTRATOR_PROD_CLIENT_ID }}
          ORCHESTRATOR_PROD_CLIENT_SECRET: ${{ secrets.ORCHESTRATOR_PROD_CLIENT_SECRET }}
          ORCHESTRATOR_BASE_URL: ${{ vars.ORCHESTRATOR_BASE_URL }}
          ORCHESTRATOR_IDENTITY_URL: ${{ vars.ORCHESTRATOR_IDENTITY_URL }}
          ORCHESTRATOR_SCOPES: ${{ vars.ORCHESTRATOR_SCOPES }}
        run: npx tsx scripts/deploy.ts

      - name: Post deployment summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path deployment-summary.json) {
            "## Deployment Summary" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            "" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            "**Tenant:** ${{ steps.tenant.outputs.tenant }}" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            "**Mode:** ${{ steps.tenant.outputs.mode }}" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            "" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            '```json' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            Get-Content deployment-summary.json | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
